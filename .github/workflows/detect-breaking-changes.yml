name: Check Python API Compatibility

on:
  pull_request:
    branches: ["develop", "main", "[0-9]+-*"]
    paths:
      - 'src/scores/**.py'

permissions:
  contents: read

jobs:
  check-api:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies and Griffe
        run: |
          python -m pip install --upgrade pip
          pip install griffe
          pip install .[dev]

      - name: Run API Breaking Change Check
        # If the 'breaking-change-approved' label is attached to the PR, 
        # we append '|| true' so the step never returns a failure exit code.
        run: |
          griffe check scores \
            --search src \
            --against origin/${{ github.base_ref }} \
            --format github ${{ contains(github.event.pull_request.labels.*.name, 'breaking-change-approved') && '|| true' || '' }}
