name: Guard Breaking Change Label

on:
  pull_request:
    types: [labeled]

permissions:
  pull-requests: write

jobs:
  check-label-permission:
    if: github.event.label.name == 'breaking-change-approved'
    runs-on: ubuntu-latest
    steps:
      - name: Check user permissions
        id: check_user
        uses: actions/github-script@v7
        with:
          script: |
            const username = context.payload.sender.login;
            
            // Query the user's permission level on this repository
            const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: username
            });
            
            // Permitted roles: 'admin' or 'maintain'
            const isAuthorized = ['admin', 'maintain'].includes(data.permission);
            
            if (!isAuthorized) {
              console.log(`${username} is not authorized to apply the breaking-change label.`);
              
              // 1. Remove the label
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                name: 'breaking-change-approved'
              });
              
              // 2. Leave an explanatory comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: `⚠️ @${username}, only repository **Maintainers** or **Admins** are authorized to apply the \`breaking-change-approved\` label. This label has been automatically removed.`
              });
              
              core.setFailed("Unauthorized attempt to bypass breaking change check.");
            } else {
              console.log(`Authorization successful for user: ${username}`);
            }
